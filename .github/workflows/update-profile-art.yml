name: Update profile contribution art

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install contribution scraper dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch public contributions
        run: |
          python scripts/fetch_contributions.py "${GITHUB_REPOSITORY_OWNER}"
          echo "Fetched public contribution data at $(date -u '+%Y-%m-%d %H:%M:%S UTC')." >> "$GITHUB_STEP_SUMMARY"

      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit and push refreshed contribution art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          if git diff --cached --quiet; then
            echo "Contribution data is unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore: refresh profile contribution heatmap"
            git push
            echo "Committed and pushed the refreshed contribution data and heatmap." >> "$GITHUB_STEP_SUMMARY"
          fi
