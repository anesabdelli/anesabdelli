  <text x="12" y="484" fill="#64748b" font-family="ui-monospace, monospace" font-size="9">TYPE · FORM · LIGHT</text>
  <text x="463" y="484" fill="#64748b" font-family="ui-monospace, monospace" font-size="9">01 / 01</text>
